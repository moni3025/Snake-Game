    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="front-page" class="section 1">
            <div class="Dashboard">
                <button id="start-btn">Start Game</button>
                <h3 id="high-score">Highest Score: 0</h3>
                <h3>Game Level</h3>
            </div>

        </section>
        <section id="game-page" class="section 2">
            <div class="Gamescreen">
                <h1>Score:</h1>

            </div>
            <div id="score">Score : 0</div>
            <div id="game-board"></div>

            <div id="controls">

    <button id="up-btn">⬆️</button>

    <div class="middle-controls">

        <button id="down-btn">⬇️</button>
        <button id="right-btn">➡️</button>
    </div>

    <button id="pause-btn">⏸️</button>

</div>
